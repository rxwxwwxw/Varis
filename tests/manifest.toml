# Unified test manifest (see CONSOLIDATION_PLAN.md §3.2). Driven by `python3 tools/suite test`.
# Suites expand globs into cases; `expect_count` guards against a glob silently matching fewer files.
# Tiers (cumulative): smoke < fast < full < release.

[[suite]]
id = "unit"
kind = "d-unit"
tags = ["unit"]
timeout = 600
expect_count = 9
expect_results = 92
cases = [
  { id = "foundation", unit = "test_foundation", tier = "smoke" },
  { id = "parser", unit = "test_parser", tier = "smoke" },
  { id = "vm", unit = "test_vm", tier = "smoke" },
  { id = "libs", unit = "test_libs", tier = "fast" },
  { id = "logic", unit = "test_logic", tier = "fast" },
  { id = "stateful", unit = "test_stateful", tier = "fast" },
  { id = "narrative", unit = "test_narrative", tier = "fast" },
  { id = "presentation", unit = "test_presentation", tier = "fast" },
  { id = "battle", unit = "test_battle", tier = "fast" },
]

[[suite]]
id = "acceptance"
kind = "lua-ok"
tier = "smoke"
tags = ["datalog", "acceptance"]
glob = "tests/datalog/acceptance/positive/*.varis"
expect_count = 12

[[suite]]
id = "rejection"
kind = "lua-reject"
tier = "smoke"
tags = ["datalog", "acceptance", "negative"]
glob = "tests/datalog/acceptance/negative/*.varis"
expect_count = 3

[suite.override.13_unsafe_negation]
expect = "variable '\\?x' in rule head is not bound"

[suite.override.14_negation_cycle]
expect = "negation cycle"

[suite.override.15_relation_arity_mismatch]
expect = "relation 'edge' expects arity 2, got 1"

[[suite]]
id = "scenario"
kind = "golden"
tags = ["datalog", "scenario"]
glob = "tests/datalog/[0-9][0-9]_*.varis"
expect_count = 38
scales = { small = "fast", large = "full" }
timeout = 120

[[suite]]
id = "gap"
kind = "known-gap"
tier = "fast"
tags = ["datalog", "known-gap"]
glob = "tests/datalog/known_gaps/*.varis"

[[suite]]
id = "extensions"
kind = "extension"
tier = "fast"
tags = ["extensions"]
glob = "tests/extensions/cases/*.varis"
helpers = "tests/extensions/helpers.varis"
expect_count = 90
timeout = 300

[suite.override.negative_unsafe_head]
expect = "variable '\\?y' in rule head is not bound"

[suite.override.negative_unsafe_negation]
expect = "variable '\\?y' in negated atom is not bound"

[suite.override.negative_unsafe_guard]
expect = "variable '\\?y'.*(?:not bound|positive relation atom)"

[suite.override.negative_unsafe_comparison]
expect = "variable '\\?y' in comparison is not bound"

[suite.override.negative_query_safety]
expect = "variable '\\?x' in negated atom is not bound"

[suite.override.negative_self_negation]
expect = "negation cycle"

[suite.override.negative_anonymous_head]
expect = "anonymous variable.*rule head"

[suite.override.negative_anonymous_guard]
expect = "anonymous variable.*procedural guard"

[[suite]]
id = "regression"
kind = "differential"
tier = "fast"
tags = ["core", "differential"]
glob = "tests/regression/*.varis"
exclude = ["harness.varis"]
expected = "tests/regression/expected.json"
expect_count = 18
timeout = 60

[suite.override.coroutines]
tier = "smoke"

[suite.override.errors]
tier = "smoke"

[suite.override.metamethods]
tier = "smoke"

[suite.override.strings]
tier = "smoke"

[suite.override.tables]
tier = "smoke"

[[suite]]
id = "core"
kind = "script"
tier = "full"
tags = ["core", "differential"]
timeout = 60
cases = [
  { id = "differential", command = ["python3", "tests/official/differential.py"] },
]

# Lanternfall (TOWER_DEFENSE_PLAN.md, SAMPLE_TD_PLAN.md): the hybrid tower-defense / visual-novel
# sample. It is the integration test of the battle engine: the bridge, the ten primitives, every
# trigger and modifier entry, the silent judge, saves and retries, and the French pack.
[[suite]]
id = "sample-td"
kind = "script"
tier = "fast"
tags = ["narrative", "sample-td", "battle"]
timeout = 120
cases = [
  { id = "check", command = ["{candidate}", "check"], cwd = "sample-td" },
  { id = "bridge", command = ["{candidate}", "sample-td/tests/bridge.varis"] },
  { id = "determinism", command = ["{candidate}", "sample-td/tests/determinism.varis"] },
  { id = "branches", command = ["{candidate}", "sample-td/tests/branches.varis"] },
  { id = "novice", command = ["{candidate}", "sample-td/tests/novice.varis"] },
  { id = "both-directions", command = ["{candidate}", "sample-td/tests/both_directions.varis"] },
  { id = "judge", command = ["{candidate}", "sample-td/tests/judge.varis"] },
  { id = "hub", command = ["{candidate}", "sample-td/tests/hub.varis"] },
  { id = "l10n", command = ["{candidate}", "sample-td/tests/l10n.varis"] },
  { id = "text-host-bot", command = ["{candidate}", "main.varis", "3", "--bot"], cwd = "sample-td" },
  { id = "catalog-current", command = ["{candidate}", "l10n", "extract", "--check"], cwd = "sample-td" },
]

