# Unified benchmark manifest (see CONSOLIDATION_PLAN.md §4). Driven by `python3 tools/suite bench`.
# Targets (goal/gate/floor) live in benchmarks/targets.toml.

[defaults]
runs = 7          # interleaved samples per interpreter
repeats = 5       # in-process repetitions per sample (inproc kind)
timeout = 180

# Comparators. `path` is a prebuilt binary; `ref` is a git ref built on demand with the same
# profile as the candidate (identity = commit + flags + compiler, cached under .cache/builds).
# Only clua is declared: the historical v0-snapshot/v1-perf-final comparators were retired (they
# dominated the run time); gate.time budgets in targets.toml replace their floors and ratchets.
[comparator.clua]
path = "c-implementation/src/lua"
note = "stock C Lua 5.4.9, built -O2 by c-implementation/src/Makefile"

# kind = inproc : load once, warm once, `repeats` timed executions per sample, os.clock CPU seconds
# kind = process: fresh process per sample, CPU seconds (user+sys) from rusage, peak RSS
[[group]]
id = "core"
kind = "inproc"
glob = "benchmarks/workloads/core/*.lua"
comparable = true
description = "single-kernel micro workloads that stock Lua can run"

[[group]]
id = "programs"
kind = "process"
glob = "benchmarks/workloads/programs/*.lua"
comparable = true
runs = 5
description = "application-style whole programs (output must equal C Lua's)"

[[group]]
id = "regression"
kind = "process"
glob = "tests/regression/*.lua"
exclude = ["harness.lua"]
cwd_is_parent = true
comparable = true
runs = 3
description = "checksum-verified differential programs reused as macro workloads"

[[group]]
id = "startup"
kind = "process"
glob = "benchmarks/workloads/startup/*.lua"
comparable = true
runs = 15
description = "interpreter start-up cost"

# In-process kernels for the declarative engine: fresh world per run, silent, no stock-Lua comparator.
[[group]]
id = "datalog"
kind = "inproc"
glob = "benchmarks/workloads/datalog/*.lua"
silent = true
comparable = false
description = "declarative kernels timed in-process (closure, joins, negation, incremental updates)"

# The 19 end-to-end scenario programs at benchmark scale, one fresh process each.
[[group]]
id = "scenarios"
kind = "process"
glob = "tests/datalog/[0-9][0-9]_*.lua"
args = ["large"]
cwd_is_parent = true
comparable = false
runs = 3
description = "declarative scenario programs end to end (no stock-Lua comparator)"

# In-process narrative kernels on the sample game (cwd = sample-game so its modules resolve).
[[group]]
id = "narrative"
kind = "inproc"
glob = "benchmarks/workloads/narrative/*.lua"
cwd = "sample-game"
silent = true
comparable = false
repeats = 3
description = "session play, save/load/replay and analysis timed in-process"

[[group]]
id = "narrative_e2e"
kind = "process"
comparable = false
runs = 5
description = "scripted sample-game walkthrough end to end"
cases = [{ id = "sample_game_check", path = "sample-game/tools/check.lua", cwd = "sample-game" }]
